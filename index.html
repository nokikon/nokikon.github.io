<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Wallet Pro</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0f172a;
  color:white;
}
.container{
  max-width:1200px;
  margin:auto;
  padding:15px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:10px;
}
.card{
  background:#1e293b;
  padding:12px;
  border-radius:10px;
}
h2{margin:0 0 8px 0;font-size:16px;}
input,select,button{
  width:100%;
  padding:8px;
  margin-top:5px;
  border-radius:6px;
  border:none;
  font-size:13px;
}
button{
  background:#3b82f6;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:0.9}
.walletCard{
  background:#111827;
  padding:10px;
  border-radius:8px;
  margin-bottom:6px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.small{
  padding:3px 6px;
  font-size:11px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:12px;
}
th,td{
  border-bottom:1px solid #334155;
  padding:6px;
}
</style>
</head>

<body>
<div class="container">

<h1>💰 Finance Dashboard</h1>

<div class="card">
Total Balance: ₱<b id="totalBalance">0</b>
</div>

<!-- WALLET CARDS -->
<div class="card">
<h2>Wallets</h2>
<div id="walletCards"></div>

<input id="walletName" placeholder="New wallet">
<button onclick="addWallet()">Add Wallet</button>
</div>

<div class="grid">

<!-- TRANSACTION -->
<div class="card">
<h2>Add Transaction</h2>

<select id="walletSelect"></select>

<select id="type">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>

<select id="category"></select>

<input type="number" id="amount" placeholder="Amount">

<select id="currency">
<option value="PHP">PHP</option>
<option value="USD">USD</option>
</select>

<button onclick="saveTransaction()">Save</button>
</div>

<!-- TRANSFER -->
<div class="card">
<h2>Transfer</h2>
<select id="fromWallet"></select>
<select id="toWallet"></select>
<input type="number" id="transferAmount" placeholder="Amount PHP">
<button onclick="transfer()">Move</button>
</div>

<!-- CATEGORY -->
<div class="card">
<h2>Categories</h2>
<div id="catList"></div>
<input id="newCategory" placeholder="New category">
<button onclick="addCategory()">Add</button>
</div>

</div>

<!-- HISTORY -->
<div class="card">
<h2>History</h2>
<table>
<thead>
<tr>
<th>Date</th><th>Wallet</th><th>Type</th><th>Category</th><th>Amount</th><th></th>
</tr>
</thead>
<tbody id="txTable"></tbody>
</table>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot, doc,
  updateDoc, deleteDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5Iysfx-S3N1HyCqxr_JCXIhRa2Ds-ELY",
  authDomain: "financial-management-too-88cd2.firebaseapp.com",
  projectId: "financial-management-too-88cd2",
  storageBucket: "financial-management-too-88cd2.firebasestorage.app",
  messagingSenderId: "800320121078",
  appId: "1:800320121078:web:419fc17ecc4323a90564d7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const USD_RATE = 56;

let walletsMap={};


// ================= WALLETS =================
onSnapshot(collection(db,"wallets"), snap=>{
  walletSelect.innerHTML = fromWallet.innerHTML = toWallet.innerHTML="";
  walletCards.innerHTML="";
  walletsMap={};

  let total=0;

  snap.forEach(d=>{
    const w=d.data();
    walletsMap[d.id]=w.name;
    total+=w.balance||0;

    walletSelect.innerHTML+=`<option value="${d.id}">${w.name}</option>`;
    fromWallet.innerHTML+=`<option value="${d.id}">${w.name}</option>`;
    toWallet.innerHTML=fromWallet.innerHTML;

    walletCards.innerHTML+=`
      <div class="walletCard">
        <div>
          <b>${w.name}</b><br>
          ₱${(w.balance||0).toFixed(2)}
        </div>
        <button class="small" onclick="deleteWallet('${d.id}')">❌</button>
      </div>
    `;
  });

  totalBalance.innerText=total.toFixed(2);
});

window.addWallet = async ()=>{
  const name=walletName.value.trim();
  if(!name) return;
  await addDoc(collection(db,"wallets"),{name,balance:0});
  walletName.value="";
};

window.deleteWallet = async (id)=>{
  if(!confirm("Delete this wallet?")) return;
  await deleteDoc(doc(db,"wallets",id));
};


// ================= CATEGORIES =================
onSnapshot(collection(db,"categories"), snap=>{
  category.innerHTML="";
  catList.innerHTML="";
  snap.forEach(d=>{
    const c=d.data().name;
    category.innerHTML+=`<option>${c}</option>`;
    catList.innerHTML+=`
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;">
        ${c}
        <button class="small" onclick="deleteCategory('${d.id}')">❌</button>
      </div>`;
  });
});

// default if empty
setDoc(doc(db,"categories","Food"),{name:"Food"});
setDoc(doc(db,"categories","Rent"),{name:"Rent"});
setDoc(doc(db,"categories","Transport"),{name:"Transport"});
setDoc(doc(db,"categories","Entertainment"),{name:"Entertainment"});
setDoc(doc(db,"categories","Other"),{name:"Other"});

window.addCategory = async ()=>{
  const name=newCategory.value.trim();
  if(!name) return;
  await setDoc(doc(db,"categories",name),{name});
  newCategory.value="";
};

window.deleteCategory = async (id)=>{
  await deleteDoc(doc(db,"categories",id));
};


// ================= TRANSACTION =================
window.saveTransaction = async ()=>{
  let wallet=walletSelect.value;
  let type=document.getElementById("type").value;
  let cat=category.value;
  let amt=parseFloat(amount.value);
  let curr=currency.value;

  if(isNaN(amt)) return;
  if(curr==="USD") amt*=USD_RATE;

  const ref=doc(db,"wallets",wallet);
  const snap = await new Promise(r=>onSnapshot(ref,d=>r(d)));
  let bal=snap.data().balance||0;
  bal= type==="income"? bal+amt : bal-amt;
  await updateDoc(ref,{balance:bal});

  await addDoc(collection(db,"transactions"),{
    wallet,type,category:cat,amount:amt,date:new Date()
  });

  amount.value="";
};


// ================= TRANSFER =================
window.transfer = async ()=>{
  const from=fromWallet.value;
  const to=toWallet.value;
  const amt=parseFloat(transferAmount.value);
  if(isNaN(amt)||from===to) return;

  const sFrom = await new Promise(r=>onSnapshot(doc(db,"wallets",from),d=>r(d)));
  const sTo = await new Promise(r=>onSnapshot(doc(db,"wallets",to),d=>r(d)));

  await updateDoc(doc(db,"wallets",from),{balance:(sFrom.data().balance||0)-amt});
  await updateDoc(doc(db,"wallets",to),{balance:(sTo.data().balance||0)+amt});

  transferAmount.value="";
};


// ================= HISTORY =================
onSnapshot(collection(db,"transactions"), snap=>{
  txTable.innerHTML="";
  snap.forEach(docu=>{
    const t=docu.data();
    const date=new Date(t.date.seconds*1000);

    txTable.innerHTML+=`
      <tr>
        <td>${date.toLocaleDateString()}</td>
        <td>${walletsMap[t.wallet]||""}</td>
        <td>${t.type}</td>
        <td>${t.category}</td>
        <td>₱${t.amount.toFixed(2)}</td>
        <td><button class="small" onclick="removeTx('${docu.id}')">❌</button></td>
      </tr>
    `;
  });
});

window.removeTx = async(id)=>{
  await deleteDoc(doc(db,"transactions",id));
};

</script>
</body>
</html>
