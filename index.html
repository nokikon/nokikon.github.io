<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Wallet</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0f172a;
  color:white;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:20px;
}
.card{
  background:#1e293b;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}
h2{margin-top:0}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:none;
}
button{
  background:#3b82f6;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:0.9}
.warning{
  color:#ff6b6b;
  font-weight:bold;
  margin-top:10px;
}
.success{
  color:#4ade80;
  font-weight:bold;
  margin-top:10px;
}
</style>
</head>

<body>
<div class="container">

<h1>💰 Finance Dashboard</h1>

<div class="card">
<h2>Total Balance (PHP)</h2>
<h1>₱<span id="totalBalance">0</span></h1>
</div>

<div class="card">
<h2>Create Wallet</h2>
<input id="walletName" placeholder="Wallet name">
<button onclick="addWallet()">Add Wallet</button>
</div>

<div class="card">
<h2>Add Transaction</h2>

<select id="walletSelect"></select>

<select id="type">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>

<select id="category">
<option>Food</option>
<option>Rent</option>
<option>Transport</option>
<option>Entertainment</option>
<option>Other</option>
</select>

<input type="number" id="amount" placeholder="Amount">

<select id="currency">
<option value="PHP">PHP</option>
<option value="USD">USD</option>
</select>

<button onclick="saveTransaction()">Save</button>
<div id="budgetWarning" class="warning"></div>
</div>

<div class="card">
<h2>Transfer Between Wallets</h2>

<select id="fromWallet"></select>
<select id="toWallet"></select>
<input type="number" id="transferAmount" placeholder="Amount PHP">

<button onclick="transfer()">Transfer</button>
</div>

<div class="card">
<h2>Set Monthly Budget</h2>

<select id="budgetCategory">
<option>Food</option>
<option>Rent</option>
<option>Transport</option>
<option>Entertainment</option>
<option>Other</option>
</select>

<input type="number" id="budgetAmount" placeholder="Budget PHP">
<button onclick="saveBudget()">Save Budget</button>
<div id="budgetSaved" class="success"></div>
</div>

</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot, doc, setDoc, updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5Iysfx-S3N1HyCqxr_JCXIhRa2Ds-ELY",
  authDomain: "financial-management-too-88cd2.firebaseapp.com",
  projectId: "financial-management-too-88cd2",
  storageBucket: "financial-management-too-88cd2.firebasestorage.app",
  messagingSenderId: "800320121078",
  appId: "1:800320121078:web:419fc17ecc4323a90564d7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const USD_RATE = 56; // you can change anytime

// ---------- LOAD WALLETS ----------
onSnapshot(collection(db,"wallets"), snap=>{
  const select = document.getElementById("walletSelect");
  const from = document.getElementById("fromWallet");
  const to = document.getElementById("toWallet");
  select.innerHTML = from.innerHTML = to.innerHTML = "";
  snap.forEach(docu=>{
    const w = docu.data();
    select.innerHTML += `<option value="${docu.id}">${w.name}</option>`;
    from.innerHTML += `<option value="${docu.id}">${w.name}</option>`;
    to.innerHTML = from.innerHTML;
  });
});

// ---------- TOTAL ----------
onSnapshot(collection(db,"wallets"), snap=>{
  let total=0;
  snap.forEach(d=> total+= (d.data().balance||0));
  document.getElementById("totalBalance").innerText = total.toFixed(2);
});

// ---------- ADD WALLET ----------
window.addWallet = async ()=>{
  const name = walletName.value.trim();
  if(!name) return;
  await addDoc(collection(db,"wallets"), {name,balance:0});
  walletName.value="";
};

// ---------- SAVE TRANSACTION ----------
window.saveTransaction = async ()=>{
  let wallet = walletSelect.value;
  let type = typeEl.value;
  let cat = category.value;
  let amt = parseFloat(amount.value);
  let curr = currency.value;

  if(isNaN(amt)) return;

  if(curr==="USD") amt*=USD_RATE;

  const ref = doc(db,"wallets",wallet);

  onSnapshot(ref, async d=>{
    let bal = d.data().balance||0;
    bal = type==="income"? bal+amt : bal-amt;
    await updateDoc(ref,{balance:bal});
  });

  await addDoc(collection(db,"transactions"),{
    wallet,type,category:cat,amount:amt,date:new Date()
  });

  amount.value="";
  checkBudget(cat);
};

const typeEl = document.getElementById("type");

// ---------- TRANSFER ----------
window.transfer = async ()=>{
  const from = fromWallet.value;
  const to = toWallet.value;
  const amt = parseFloat(transferAmount.value);
  if(isNaN(amt) || from===to) return;

  const refFrom = doc(db,"wallets",from);
  const refTo = doc(db,"wallets",to);

  onSnapshot(refFrom, async d=>{
    await updateDoc(refFrom,{balance:(d.data().balance||0)-amt});
  });
  onSnapshot(refTo, async d=>{
    await updateDoc(refTo,{balance:(d.data().balance||0)+amt});
  });

  transferAmount.value="";
};

// ---------- SAVE BUDGET ----------
window.saveBudget = async ()=>{
  const cat = budgetCategory.value;
  const amt = parseFloat(budgetAmount.value);
  if(isNaN(amt)) return;
  await setDoc(doc(db,"budgets",cat),{amount:amt});
  budgetSaved.innerText="Budget saved!";
  setTimeout(()=>budgetSaved.innerText="",2000);
};

// ---------- CHECK BUDGET ----------
async function checkBudget(cat){
  const month = new Date().getMonth();
  let spent=0;

  onSnapshot(collection(db,"transactions"), snap=>{
    snap.forEach(t=>{
      const data=t.data();
      const d=new Date(data.date.seconds*1000);
      if(data.category===cat && data.type==="expense" && d.getMonth()===month)
        spent+=data.amount;
    });
  });

  onSnapshot(doc(db,"budgets",cat), d=>{
    if(!d.exists()) return;
    const limit=d.data().amount;
    if(spent>limit){
      budgetWarning.innerText=`⚠ Overspent in ${cat}!`;
    }else{
      budgetWarning.innerText="";
    }
  });
}

</script>
</body>
</html>
