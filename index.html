<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud Wallet Pro</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0f172a;
  color:white;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}
.card{
  background:#1e293b;
  padding:15px;
  margin-bottom:15px;
  border-radius:10px;
}
h2{margin-top:0}
input,select,button{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:8px;
  border:none;
}
button{
  background:#3b82f6;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
button:hover{opacity:0.9}
.warning{color:#ff6b6b;font-weight:bold;margin-top:10px;}
.success{color:#4ade80;font-weight:bold;margin-top:10px;}
table{
  width:100%;
  margin-top:10px;
  border-collapse:collapse;
}
th,td{
  padding:8px;
  border-bottom:1px solid #334155;
  font-size:14px;
}
.small-btn{
  padding:5px 8px;
  margin:2px;
  font-size:12px;
}
</style>
</head>

<body>
<div class="container">

<h1>💰 Finance Dashboard</h1>

<div class="card">
<h2>Total Balance (PHP)</h2>
<h1>₱<span id="totalBalance">0</span></h1>
</div>

<div class="card">
<h2>Create Wallet</h2>
<input id="walletName" placeholder="Wallet name">
<button onclick="addWallet()">Add Wallet</button>
</div>

<div class="card">
<h2>Add Transaction</h2>

<select id="walletSelect"></select>

<select id="type">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>

<select id="category">
<option>Food</option>
<option>Rent</option>
<option>Transport</option>
<option>Entertainment</option>
<option>Other</option>
</select>

<input type="number" id="amount" placeholder="Amount">

<select id="currency">
<option value="PHP">PHP</option>
<option value="USD">USD</option>
</select>

<button onclick="saveTransaction()">Save</button>
<div id="budgetWarning" class="warning"></div>
</div>

<div class="card">
<h2>Transfer Between Wallets</h2>

<select id="fromWallet"></select>
<select id="toWallet"></select>
<input type="number" id="transferAmount" placeholder="Amount PHP">

<button onclick="transfer()">Transfer</button>
</div>

<div class="card">
<h2>Set Monthly Budget</h2>

<select id="budgetCategory">
<option>Food</option>
<option>Rent</option>
<option>Transport</option>
<option>Entertainment</option>
<option>Other</option>
</select>

<input type="number" id="budgetAmount" placeholder="Budget PHP">
<button onclick="saveBudget()">Save Budget</button>
<div id="budgetSaved" class="success"></div>
</div>

<div class="card">
<h2>Transactions History</h2>

<select id="filterWallet">
<option value="all">All Wallets</option>
</select>

<table>
<thead>
<tr>
<th>Date</th>
<th>Wallet</th>
<th>Type</th>
<th>Category</th>
<th>Amount</th>
<th>Actions</th>
</tr>
</thead>
<tbody id="txTable"></tbody>
</table>

</div>

<div class="card">
<h2>Spending by Category (This Month)</h2>
<canvas id="chart"></canvas>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, onSnapshot, doc,
  setDoc, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5Iysfx-S3N1HyCqxr_JCXIhRa2Ds-ELY",
  authDomain: "financial-management-too-88cd2.firebaseapp.com",
  projectId: "financial-management-too-88cd2",
  storageBucket: "financial-management-too-88cd2.firebasestorage.app",
  messagingSenderId: "800320121078",
  appId: "1:800320121078:web:419fc17ecc4323a90564d7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const USD_RATE = 56;

let walletsMap = {};


// ================= WALLETS =================
onSnapshot(collection(db,"wallets"), snap=>{
  const select = walletSelect;
  const from = fromWallet;
  const to = toWallet;
  const filter = filterWallet;

  select.innerHTML = from.innerHTML = to.innerHTML = "";
  filter.innerHTML = `<option value="all">All Wallets</option>`;
  walletsMap={};

  snap.forEach(docu=>{
    const w = docu.data();
    walletsMap[docu.id]=w.name;
    select.innerHTML += `<option value="${docu.id}">${w.name}</option>`;
    from.innerHTML += `<option value="${docu.id}">${w.name}</option>`;
    to.innerHTML = from.innerHTML;
    filter.innerHTML += `<option value="${docu.id}">${w.name}</option>`;
  });
});

onSnapshot(collection(db,"wallets"), snap=>{
  let total=0;
  snap.forEach(d=> total+= (d.data().balance||0));
  totalBalance.innerText = total.toFixed(2);
});

window.addWallet = async ()=>{
  const name = walletName.value.trim();
  if(!name) return;
  await addDoc(collection(db,"wallets"), {name,balance:0});
  walletName.value="";
};


// ================= TRANSACTION =================
window.saveTransaction = async ()=>{
  let wallet = walletSelect.value;
  let type = document.getElementById("type").value;
  let cat = category.value;
  let amt = parseFloat(amount.value);
  let curr = currency.value;

  if(isNaN(amt)) return;
  if(curr==="USD") amt*=USD_RATE;

  const ref = doc(db,"wallets",wallet);

  const snap = await new Promise(r=>onSnapshot(ref,d=>r(d)));
  let bal = snap.data().balance||0;
  bal = type==="income"? bal+amt : bal-amt;
  await updateDoc(ref,{balance:bal});

  await addDoc(collection(db,"transactions"),{
    wallet,type,category:cat,amount:amt,date:new Date()
  });

  amount.value="";
  checkBudget(cat);
};


// ================= TRANSFER =================
window.transfer = async ()=>{
  const from = fromWallet.value;
  const to = toWallet.value;
  const amt = parseFloat(transferAmount.value);
  if(isNaN(amt) || from===to) return;

  const refFrom = doc(db,"wallets",from);
  const refTo = doc(db,"wallets",to);

  const sFrom = await new Promise(r=>onSnapshot(refFrom,d=>r(d)));
  const sTo = await new Promise(r=>onSnapshot(refTo,d=>r(d)));

  await updateDoc(refFrom,{balance:(sFrom.data().balance||0)-amt});
  await updateDoc(refTo,{balance:(sTo.data().balance||0)+amt});

  transferAmount.value="";
};


// ================= BUDGET =================
window.saveBudget = async ()=>{
  const cat = budgetCategory.value;
  const amt = parseFloat(budgetAmount.value);
  if(isNaN(amt)) return;
  await setDoc(doc(db,"budgets",cat),{amount:amt});
  budgetSaved.innerText="Budget saved!";
  setTimeout(()=>budgetSaved.innerText="",2000);
};

async function checkBudget(cat){
  const month = new Date().getMonth();
  let spent=0;

  const txSnap = await new Promise(r=>onSnapshot(collection(db,"transactions"),s=>r(s)));
  txSnap.forEach(t=>{
    const data=t.data();
    const d=new Date(data.date.seconds*1000);
    if(data.category===cat && data.type==="expense" && d.getMonth()===month)
      spent+=data.amount;
  });

  const b = await new Promise(r=>onSnapshot(doc(db,"budgets",cat),d=>r(d)));
  if(!b.exists()) return;
  const limit=b.data().amount;
  budgetWarning.innerText = spent>limit ? `⚠ Overspent in ${cat}!` : "";
}



// ================= HISTORY =================
let chart;

onSnapshot(collection(db,"transactions"), snap=>{
  const filter = filterWallet.value;
  txTable.innerHTML="";
  const month = new Date().getMonth();
  let categorySum={};

  snap.forEach(docu=>{
    const t = docu.data();
    if(filter!=="all" && t.wallet!==filter) return;

    const date = new Date(t.date.seconds*1000);
    const walletName = walletsMap[t.wallet]||"";

    txTable.innerHTML += `
      <tr>
        <td>${date.toLocaleDateString()}</td>
        <td>${walletName}</td>
        <td>${t.type}</td>
        <td>${t.category}</td>
        <td>₱${t.amount.toFixed(2)}</td>
        <td>
          <button class="small-btn" onclick="removeTx('${docu.id}')">❌</button>
        </td>
      </tr>
    `;

    if(t.type==="expense" && date.getMonth()===month){
      categorySum[t.category]=(categorySum[t.category]||0)+t.amount;
    }
  });

  drawChart(categorySum);
});

window.removeTx = async (id)=>{
  await deleteDoc(doc(db,"transactions",id));
};

filterWallet.onchange = ()=>onSnapshot(collection(db,"transactions"),()=>{});


// ================= CHART =================
function drawChart(data){
  const ctx = document.getElementById("chart");

  if(chart) chart.destroy();

  chart = new Chart(ctx,{
    type:"pie",
    data:{
      labels:Object.keys(data),
      datasets:[{data:Object.values(data)}]
    }
  });
}

</script>
</body>
</html>
