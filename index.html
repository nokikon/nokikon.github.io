<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallet Tracker</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0f172a;
    color:white;
    margin:0;
    padding:20px;
}
h1,h2{margin:10px 0;}
.card{
    background:#1e293b;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}
input,select,button{
    padding:10px;
    margin:5px 0;
    width:100%;
    border-radius:8px;
    border:none;
}
button{
    background:#3b82f6;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
button:hover{background:#2563eb;}
.warning{
    background:#dc2626;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
}
.small{font-size:12px;opacity:0.8;}
</style>
</head>

<body>

<h1>💰 Wallet Tracker</h1>

<div class="card">
<h2>Total Balance (PHP)</h2>
<h1 id="total">₱0</h1>
<div id="budgetWarning"></div>
</div>

<div class="card">
<h2>Add Transaction</h2>

<select id="wallet"></select>

<select id="type">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>

<input type="number" id="amount" placeholder="Amount">

<select id="currency">
<option value="PHP">PHP</option>
<option value="USD">USD</option>
</select>

<button onclick="addTransaction()">Save</button>
<div class="small">USD will be converted to PHP automatically</div>
</div>

<div class="card">
<h2>Transfer Between Wallets</h2>

<select id="fromWallet"></select>
<select id="toWallet"></select>
<input type="number" id="transferAmount" placeholder="Amount PHP">

<button onclick="transfer()">Transfer</button>
</div>

<div class="card">
<h2>Create Wallet</h2>
<input type="text" id="newWallet" placeholder="Wallet name">
<button onclick="createWallet()">Add Wallet</button>
</div>

<div class="card">
<h2>History</h2>
<div id="history"></div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
getFirestore,
collection,
addDoc,
onSnapshot,
doc,
setDoc,
updateDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC5Iysfx-S3N1HyCqxr_JCXIhRa2Ds-ELY",
  authDomain: "financial-management-too-88cd2.firebaseapp.com",
  projectId: "financial-management-too-88cd2",
  storageBucket: "financial-management-too-88cd2.firebasestorage.app",
  messagingSenderId: "800320121078",
  appId: "1:800320121078:web:419fc17ecc4323a90564d7",
  measurementId: "G-PVP48DB0K7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const USD_RATE = 56;   // change anytime
const BUDGET_LIMIT = 50000; // warning

const walletSelect = document.getElementById("wallet");
const fromWallet = document.getElementById("fromWallet");
const toWallet = document.getElementById("toWallet");

function formatPHP(v){
return "₱" + v.toLocaleString();
}

async function createWallet(){
const name = document.getElementById("newWallet").value;
if(!name) return;
await setDoc(doc(db,"wallets",name),{balance:0});
document.getElementById("newWallet").value="";
}

window.createWallet = createWallet;

function loadWallets(){
onSnapshot(collection(db,"wallets"), snap=>{
walletSelect.innerHTML="";
fromWallet.innerHTML="";
toWallet.innerHTML="";
let total=0;

snap.forEach(d=>{
const data=d.data();
total+=data.balance;

const opt=document.createElement("option");
opt.value=d.id;
opt.text=d.id;
walletSelect.appendChild(opt);

const opt2=opt.cloneNode(true);
fromWallet.appendChild(opt2);

const opt3=opt.cloneNode(true);
toWallet.appendChild(opt3);
});

document.getElementById("total").innerText=formatPHP(total);

if(total<0 || total>BUDGET_LIMIT){
document.getElementById("budgetWarning").innerHTML=
'<div class="warning">⚠ Budget attention required</div>';
}else{
document.getElementById("budgetWarning").innerHTML="";
}
});
}

loadWallets();

async function addTransaction(){
const wallet=walletSelect.value;
const type=document.getElementById("type").value;
let amount=parseFloat(document.getElementById("amount").value);
const currency=document.getElementById("currency").value;

if(!wallet || !amount) return;

if(currency==="USD") amount*=USD_RATE;
if(type==="expense") amount*=-1;

const ref=doc(db,"wallets",wallet);
onSnapshot(ref, async snap=>{
const current=snap.data().balance || 0;
await updateDoc(ref,{balance:current+amount});
},{once:true});

await addDoc(collection(db,"history"),{
wallet,type,amount,date:new Date()
});

document.getElementById("amount").value="";
}

window.addTransaction = addTransaction;

async function transfer(){
const from=fromWallet.value;
const to=toWallet.value;
let amount=parseFloat(document.getElementById("transferAmount").value);
if(!from||!to||!amount||from===to) return;

const fromRef=doc(db,"wallets",from);
const toRef=doc(db,"wallets",to);

onSnapshot(fromRef, async snap=>{
const bal=snap.data().balance||0;
await updateDoc(fromRef,{balance:bal-amount});
},{once:true});

onSnapshot(toRef, async snap=>{
const bal=snap.data().balance||0;
await updateDoc(toRef,{balance:bal+amount});
},{once:true});

await addDoc(collection(db,"history"),{
wallet:from+" → "+to,
type:"transfer",
amount,date:new Date()
});

document.getElementById("transferAmount").value="";
}

window.transfer = transfer;

onSnapshot(collection(db,"history"), snap=>{
const div=document.getElementById("history");
div.innerHTML="";
snap.forEach(d=>{
const h=d.data();
const el=document.createElement("div");
el.innerText=`${h.wallet} | ${h.type} | ${formatPHP(h.amount)}`;
div.appendChild(el);
});
});

</script>

</body>
</html>
