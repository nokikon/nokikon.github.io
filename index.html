<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Finance App</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f4f6f8;margin:10px;}
.card{background:white;padding:12px;margin-bottom:10px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1);}
h2{margin-bottom:8px;font-size:16px;}
input,select,button{padding:6px;margin:3px;font-size:14px;}
button{background:#1877f2;color:white;border:none;border-radius:6px;cursor:pointer;}
button:hover{background:#145dbf;}
.small{font-size:12px;color:gray;}
.wallet-item{display:flex;justify-content:space-between;margin-bottom:4px;}
</style>
</head>

<body>

<h1>💰 Finance Dashboard</h1>

<!-- TOTAL -->
<div class="card">
<h2>Total Net Worth (PHP)</h2>
<div id="total">0</div>
</div>

<!-- WALLETS -->
<div class="card">
<h2>Wallets</h2>

<input id="newWallet" placeholder="Wallet name">
<input id="startBalance" type="number" placeholder="Balance PHP">
<button onclick="addWallet()">Add</button>

<div id="walletList"></div>
</div>

<!-- CATEGORY -->
<div class="card">
<h2>Categories</h2>

<input id="newCategory" placeholder="New category">
<button onclick="addCategory()">Add</button>

<div id="catList" class="small"></div>
</div>

<!-- TRANSACTION -->
<div class="card">
<h2>Add Transaction</h2>

<select id="walletSelect"></select>

<select id="type">
<option value="income">Income</option>
<option value="expense">Expense</option>
</select>

<select id="category"></select>

<input id="amount" type="number" placeholder="Amount">

<select id="currency">
<option value="PHP">PHP</option>
<option value="USD">USD</option>
</select>

<br>

📅 <input type="date" id="txDate">

🔁 
<select id="repeat">
<option value="none">No repeat</option>
<option value="daily">Daily</option>
<option value="weekly">Weekly</option>
<option value="monthly">Monthly</option>
</select>

<br>
<button onclick="saveTransaction()">Save</button>
</div>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* YOUR CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyC5Iysfx-S3N1HyCqxr_JCXIhRa2Ds-ELY",
  authDomain: "financial-management-too-88cd2.firebaseapp.com",
  projectId: "financial-management-too-88cd2",
  storageBucket: "financial-management-too-88cd2.firebasestorage.app",
  messagingSenderId: "800320121078",
  appId: "1:800320121078:web:419fc17ecc4323a90564d7"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* GLOBAL */
const USD_RATE = 56; // you can change anytime

/* ELEMENTS */
const walletSelect=document.getElementById("walletSelect");
const categorySelect=document.getElementById("category");

/* LOAD WALLETS */
onSnapshot(collection(db,"wallets"), snap=>{
  walletSelect.innerHTML="";
  let total=0;
  const list=document.getElementById("walletList");
  list.innerHTML="";

  snap.forEach(d=>{
    const data=d.data();
    total+=data.balance||0;

    walletSelect.innerHTML+=`<option value="${d.id}">${d.id}</option>`;

    list.innerHTML+=`
    <div class="wallet-item">
      ${d.id}: ₱${(data.balance||0).toFixed(2)}
      <button onclick="deleteWallet('${d.id}')">X</button>
    </div>`;
  });

  document.getElementById("total").innerText="₱"+total.toFixed(2);
});

/* LOAD CATEGORIES */
onSnapshot(collection(db,"categories"), snap=>{
  categorySelect.innerHTML="";
  const list=document.getElementById("catList");
  list.innerHTML="";
  snap.forEach(d=>{
    categorySelect.innerHTML+=`<option value="${d.id}">${d.id}</option>`;
    list.innerHTML+=`${d.id} <button onclick="deleteCategory('${d.id}')">X</button><br>`;
  });
});

/* ADD WALLET */
window.addWallet = async ()=>{
  let name=document.getElementById("newWallet").value;
  let bal=parseFloat(document.getElementById("startBalance").value)||0;
  if(!name) return;
  await updateDoc(doc(db,"wallets",name),{balance:bal}).catch(async()=>{
    await addDoc(collection(db,"wallets"),{});
    await updateDoc(doc(db,"wallets",name),{balance:bal});
  });
  newWallet.value=""; startBalance.value="";
};

/* DELETE WALLET */
window.deleteWallet = async (id)=>{
  await deleteDoc(doc(db,"wallets",id));
};

/* ADD CATEGORY */
window.addCategory = async ()=>{
  let name=newCategory.value;
  if(!name) return;
  await updateDoc(doc(db,"categories",name),{});
  newCategory.value="";
};

/* DELETE CATEGORY */
window.deleteCategory = async (id)=>{
  await deleteDoc(doc(db,"categories",id));
};

/* SAVE TRANSACTION */
window.saveTransaction = async ()=>{
  let wallet = walletSelect.value;
  let type   = document.getElementById("type").value;
  let cat    = categorySelect.value;
  let amt    = parseFloat(amount.value);
  let curr   = currency.value;
  let txDate = document.getElementById("txDate").value;
  let repeat = document.getElementById("repeat").value;

  if(isNaN(amt)) return;

  if(curr==="USD") amt*=USD_RATE;

  const finalDate = txDate ? new Date(txDate) : new Date();

  const ref = doc(db,"wallets",wallet);

  onSnapshot(ref, async snap=>{
    let bal=snap.data().balance||0;
    bal = type==="income" ? bal+amt : bal-amt;
    await updateDoc(ref,{balance:bal});
  },{once:true});

  await addDoc(collection(db,"transactions"),{
    wallet,type,category:cat,amount:amt,currency:curr,date:finalDate,repeat
  });

  amount.value="";
};
</script>

</body>
</html>
