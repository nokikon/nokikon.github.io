<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Finance Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background: #f0f2f5; padding: 20px; }
    h1 { text-align: center; margin-bottom: 20px; color: #333; }
    .container { max-width: 900px; margin: auto; display: flex; flex-direction: column; gap: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
    input, select { padding: 8px; margin-right: 10px; border-radius: 6px; border: 1px solid #ccc; }
    button { padding: 8px 12px; border-radius: 6px; border: none; background: #1877f2; color: white; cursor: pointer; }
    button:hover { background: #145dbf; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
    .networth { text-align: center; font-size: 1.5rem; color: #1877f2; font-weight: bold; }
    .file-input { margin-top: 10px; }
  </style>
</head>
<body>

<h1>My Finance Dashboard</h1>
<div class="container">

  <!-- Net Worth -->
  <div class="card">
    <div class="networth">Net Worth: $<span id="networth">0</span></div>
  </div>

  <!-- Add Accounts -->
  <div class="card">
    <h2>Add Account</h2>
    <input type="text" id="accountName" placeholder="Account name">
    <input type="number" id="accountBalance" placeholder="Initial balance">
    <button onclick="addAccount()">Add Account</button>
    <table id="accountsTable">
      <thead><tr><th>Account</th><th>Balance</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Add Transaction -->
  <div class="card">
    <h2>Add Transaction</h2>
    <select id="transactionAccount"></select>
    <select id="transactionType">
      <option value="income">Income</option>
      <option value="expense">Expense</option>
      <option value="debt">Debt</option>
    </select>
    <select id="transactionCategory">
      <option value="Food">Food</option>
      <option value="Rent">Rent</option>
      <option value="Investment">Investment</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Other">Other</option>
    </select>
    <input type="number" id="transactionAmount" placeholder="Amount">
    <button onclick="addTransaction()">Add</button>
    <table id="transactionsTable">
      <thead><tr><th>Account</th><th>Type</th><th>Category</th><th>Amount</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Charts -->
  <div class="card">
    <h2>Income vs Expenses Over Time</h2>
    <canvas id="incomeExpenseChart"></canvas>
  </div>
  <div class="card">
    <h2>Spending by Category</h2>
    <canvas id="categoryChart"></canvas>
  </div>

  <!-- CSV Export/Import -->
  <div class="card">
    <h2>Backup / Restore Data</h2>
    <button onclick="exportCSV()">Export CSV</button>
    <input type="file" class="file-input" onchange="importCSV(event)">
  </div>

</div>

<!-- Chart.js Library -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  // --- Step 4: Simple Login ---
  const PASSWORD = "mypassword"; // Change to your own password
  const userPass = prompt("Enter password to access your finance dashboard:");
  if(userPass !== PASSWORD){
    alert("Incorrect password! Access denied.");
    document.body.innerHTML = "<h2 style='text-align:center;margin-top:50px'>Access Denied</h2>";
  }

  // --- Data Storage ---
  let accounts = JSON.parse(localStorage.getItem('accounts') || '[]');
  let transactions = JSON.parse(localStorage.getItem('transactions') || '[]');

  // --- Accounts ---
  function updateAccounts() {
    const tbody = document.querySelector('#accountsTable tbody');
    const select = document.getElementById('transactionAccount');
    tbody.innerHTML = '';
    select.innerHTML = '';
    accounts.forEach(acc => {
      tbody.innerHTML += `<tr><td>${acc.name}</td><td>$${acc.balance.toFixed(2)}</td></tr>`;
      select.innerHTML += `<option value="${acc.name}">${acc.name}</option>`;
    });
    updateNetWorth();
  }

  function addAccount() {
    const name = document.getElementById('accountName').value.trim();
    const balance = parseFloat(document.getElementById('accountBalance').value);
    if(!name || isNaN(balance)) return alert('Enter valid name and balance');
    accounts.push({name, balance});
    localStorage.setItem('accounts', JSON.stringify(accounts));
    document.getElementById('accountName').value = '';
    document.getElementById('accountBalance').value = '';
    updateAccounts();
    updateCharts();
  }

  // --- Transactions ---
  function updateTransactions() {
    const tbody = document.querySelector('#transactionsTable tbody');
    tbody.innerHTML = '';
    transactions.forEach(tx => {
      tbody.innerHTML += `<tr><td>${tx.account}</td><td>${tx.type}</td><td>${tx.category}</td><td>$${tx.amount.toFixed(2)}</td></tr>`;
    });
  }

  function addTransaction() {
    const accountName = document.getElementById('transactionAccount').value;
    const type = document.getElementById('transactionType').value;
    const category = document.getElementById('transactionCategory').value;
    const amount = parseFloat(document.getElementById('transactionAmount').value);
    if(!accountName || isNaN(amount)) return alert('Select account, category, and enter amount');

    const acc = accounts.find(a => a.name === accountName);
    if(type === 'expense' || type === 'debt') acc.balance -= amount;
    else acc.balance += amount;

    transactions.push({account: accountName, type, amount, category, date: new Date()});
    localStorage.setItem('accounts', JSON.stringify(accounts));
    localStorage.setItem('transactions', JSON.stringify(transactions));

    document.getElementById('transactionAmount').value = '';
    updateAccounts();
    updateTransactions();
    updateCharts();
  }

  // --- Net Worth ---
  function updateNetWorth() {
    const total = accounts.reduce((sum, acc) => sum + acc.balance, 0);
    document.getElementById('networth').textContent = total.toFixed(2);
  }

  // --- Charts (Step 1) ---
  function updateCharts() {
    const categories = {};
    const monthlyData = {};

    transactions.forEach(tx => {
      categories[tx.category] = (categories[tx.category] || 0) + tx.amount;
      const month = new Date(tx.date).toLocaleString('default', {month:'short', year:'numeric'});
      monthlyData[month] = monthlyData[month] || {income:0, expense:0};
      if(tx.type === 'income') monthlyData[month].income += tx.amount;
      else monthlyData[month].expense += tx.amount;
    });

    // Income vs Expenses Line Chart
    const ctx1 = document.getElementById('incomeExpenseChart').getContext('2d');
    if(window.lineChart) window.lineChart.destroy();
    window.lineChart = new Chart(ctx1, {
      type: 'line',
      data: {
        labels: Object.keys(monthlyData),
        datasets: [
          {label:'Income', data:Object.values(monthlyData).map(d=>d.income), borderColor:'green', fill:false},
          {label:'Expenses', data:Object.values(monthlyData).map(d=>d.expense), borderColor:'red', fill:false},
        ]
      },
      options:{responsive:true}
    });

    // Spending by Category Pie Chart
    const ctx2 = document.getElementById('categoryChart').getContext('2d');
    if(window.pieChart) window.pieChart.destroy();
    window.pieChart = new Chart(ctx2, {
      type: 'pie',
      data: {
        labels:Object.keys(categories),
        datasets:[{data:Object.values(categories), backgroundColor:['#1877f2','#f29f05','#ff4b5c','#32a852','#9b59b6']}]
      },
      options:{responsive:true}
    });
  }

  // --- CSV Export / Import (Step 3) ---
  function exportCSV() {
    let csv = 'Account,Type,Category,Amount,Date\n';
    transactions.forEach(t => csv += `${t.account},${t.type},${t.category},${t.amount},${t.date}\n`);
    const blob = new Blob([csv], {type:'text/csv'});
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = 'transactions.csv';
    link.click();
  }

  function importCSV(event){
    const file = event.target.files[0];
    const reader = new FileReader();
    reader.onload = e => {
      const lines = e.target.result.split('\n').slice(1);
      lines.forEach(line => {
        if(!line) return;
        const [account,type,category,amount,date] = line.split(',');
        transactions.push({account,type,category,amount:parseFloat(amount),date:new Date(date)});
      });
      localStorage.setItem('transactions', JSON.stringify(transactions));
      updateTransactions(); updateAccounts(); updateCharts();
    }
    reader.readAsText(file);
  }

  // --- Initialize ---
  updateAccounts();
  updateTransactions();
  updateCharts();
</script>

</body>
</html>
